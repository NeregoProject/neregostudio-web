# nginx.conf — Nerego Studio
# Easypanel: Traefik termina el SSL por delante; este Nginx solo sirve HTTP
# en el puerto 80 dentro del contenedor. Por eso NO hay bloque `listen 443 ssl`
# aquí (no tenemos certificados en el contenedor) ni redirección http->https
# incondicional (causaría un bucle: Traefik siempre reenvía por HTTP).

server {
    listen 80;
    listen [::]:80;
    server_name neregostudio.com www.neregostudio.com;

    root /usr/share/nginx/html;
    index index.html;

    # --- Fix #3 auditoría SEO: consolidar www -> non-www (301 permanente) ---
    if ($host = "www.neregostudio.com") {
        return 301 https://neregostudio.com$request_uri;
    }

    # --- Fix #4 auditoría SEO: cabeceras de seguridad ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache para assets estáticos
    location ~* \.(css|js|woff2|woff|ttf|svg|png|jpg|jpeg|webp|ico|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # OJO: dentro de un location con add_header, Nginx descarta los
        # add_header del nivel server. Hay que repetirlos aquí.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Sin caché para HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Incluir redirecciones 301 desde WordPress
    include /etc/nginx/conf.d/redirects.conf;

    # Página principal
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Página 404 personalizada (pendiente crear)
    # error_page 404 /404.html;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;
}

# ------------------------------------------------------------
# NOTAS IMPORTANTES ANTES DE DESPLEGAR
# ------------------------------------------------------------
# 1. En Easypanel, asegúrate de que el dominio www.neregostudio.com está
#    AÑADIDO al servicio (con su certificado). Si Traefik no conoce el
#    dominio www, la petición ni siquiera llegará a este Nginx y la
#    redirección no podrá ejecutarse.
# 2. Si Easypanel ofrece "Redirect" a nivel de dominio en el panel,
#    puedes hacer la redirección ahí y dejar en Nginx solo las cabeceras.
#    Es igual de válido y más simple.
# 3. No añadimos Content-Security-Policy todavía: como se carga el widget
#    de chat desde un CDN externo, una CSP mal ajustada puede romperlo.
#    Se puede añadir en una segunda fase probando primero con
#    Content-Security-Policy-Report-Only.
# 4. Verificación tras el deploy:
#    curl -sI https://www.neregostudio.com/ | head -5   -> debe dar 301
#    curl -sI https://neregostudio.com/ | grep -i strict -> debe mostrar HSTS
